[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-pgvector-lab"
version = "0.1.0"
description = "Question answering over technical documentation with PostgreSQL + pgvector and a Claude agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.75",
    "httpx>=0.27",
    "langchain-anthropic>=1.7",
    "langgraph>=1.2",
    "numpy>=1.26",
    "pgvector>=0.3",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
rag-lab = "rag_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a running PostgreSQL with pgvector (RAG_TEST_DSN)"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
